<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./popup.css">
    <title>CraveLens</title>
</head>

<body>
    <main>
        <header class="app-header">
            <div class="brand-mark" aria-hidden="true"><i></i><i></i></div>
            <div class="brand-copy">
                <h1>CraveLens</h1>
                <p>See it. Crave it. Get it.</p>
            </div>
            <label class="switch" aria-label="Enable CraveLens"><input id="enabled" type="checkbox"><span></span></label>
        </header>

        <section class="status"><i id="connectionDot"></i>
            <div><strong id="connectionTitle">Connecting to Swiggy…</strong><small id="connectionDetail">Secure sign-in opens automatically</small></div>
            <span class="status-spark" aria-hidden="true">✦</span>
        </section>
        <button id="connect" class="secondary connect-button" hidden>Connect Swiggy <span aria-hidden="true">↗</span></button>

        <details class="settings-card context-card" name="popup-context" open>
            <summary class="context-summary">
                <span class="section-heading"><span>01</span><h2>Personal context</h2></span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" /></svg>
            </summary>
            <div class="context-content">
                <label class="field-label">Delivery address</label>
                <div id="addressPicker" class="address-picker">
                    <button id="addressTrigger" class="address-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span><b id="addressPrimary">Connect Swiggy</b><small id="addressSecondary">Sign in to load delivery addresses</small></span><i>⌄</i>
                    </button>
                    <div id="addressList" class="address-list" role="listbox" hidden></div>
                </div>
                <small id="addressHint" class="hint"></small>
            </div>
        </details>

        <details class="settings-card context-card detection-card" name="popup-context">
            <summary class="context-summary">
                <span class="section-heading"><span>02</span><h2>Detection context</h2></span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" /></svg>
            </summary>
            <div class="context-content">
                <label class="range-row"><span>Food sensitivity</span><output id="sensitivityValue"></output><input id="sensitivity"
                        type="range" min="0.35" max="0.8" step="0.01"></label>
                <label class="range-row"><span>Model scan interval</span><output id="scanIntervalValue"></output><input id="scanIntervalMs"
                        type="range" min="2000" max="30000" step="1000"></label>
                <label class="debug-row"><span><b>Debug overlay</b><small>Show detection boxes on video</small></span><input id="debug" type="checkbox"></label>
                <button id="scan" class="secondary"><span>Scan current frame</span><kbd>Ctrl Shift Y</kbd></button>
                <button id="resetDetectionDefaults" class="reset-button" type="button">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.6 7.3A6 6 0 1 1 4 11"/><path d="M4.6 3.8v3.5h3.5"/></svg>
                    Reset detection defaults
                </button>
            </div>
        </details>

        <footer><button id="save">Save settings <span aria-hidden="true">→</span></button>
            <p id="message"></p>
            <nav class="popup-links" aria-label="CraveLens links">
                <a href="https://cravelens.nishithp.page/" target="_blank" rel="noopener noreferrer" aria-label="CraveLens website" title="Website">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21c-2.3-2.5-3.5-5.5-3.5-9S9.7 5.5 12 3Z"/></svg>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61591659457183" target="_blank" rel="noopener noreferrer" aria-label="CraveLens on Facebook" title="Facebook">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill-icon" d="M14.7 8.6V6.8c0-.9.6-1.1 1-1.1h2.5V2h-3.5c-3.9 0-4.8 2.9-4.8 4.8v1.8H7v3.8h2.9V22h4.4v-9.6h3.3l.5-3.8h-3.4Z"/></svg>
                </a>
                <a href="https://www.instagram.com/cravelens.dev/" target="_blank" rel="noopener noreferrer" aria-label="CraveLens on Instagram" title="Instagram">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="fill-icon" cx="17.4" cy="6.7" r="1.1"/></svg>
                </a>
            </nav>
        </footer>
    </main>
    <script type="module" src="./popup.js"></script>
</body>

</html>
