<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./popup.css">
    <style>
        .hint{display:block;color:#918b7f;font-size:10px;line-height:1.4;margin-top:6px}.address-picker{position:relative;margin-top:-5px}.address-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;text-align:left;background:#fffdf7;color:#191915;border:1px solid #d9d3c6;border-radius:13px;font-weight:400}.address-trigger:hover,.address-trigger[aria-expanded=true]{border-color:#ff8b6d;box-shadow:0 0 0 3px #ff603812}.address-trigger span{min-width:0}.address-trigger b,.address-trigger small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.address-trigger b{font-size:12px}.address-trigger small{font-size:10px;color:#8b8579;margin-top:3px}.address-trigger i{font-style:normal;color:#ff6038;font-size:17px;transition:.2s}.address-trigger[aria-expanded=true] i{transform:rotate(180deg)}.address-list{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;max-height:240px;overflow:auto;padding:6px;background:#fffdf8;border:1px solid #d7d0c3;border-radius:15px;box-shadow:0 18px 50px #2921132b}.address-option{display:grid;grid-template-columns:1fr auto;align-items:start;gap:4px 9px;width:100%;padding:10px;text-align:left;background:transparent;color:#191915;border:0;border-radius:10px;font-weight:400}.address-option:hover,.address-option.selected{background:#fff0e9}.address-option .badges{grid-column:1;display:flex;min-width:0}.address-option .copy{grid-column:1;min-width:0}.address-option b,.address-option small{display:block}.address-option b{font-size:11px}.address-option small{margin-top:3px;color:#777267;font-size:9.5px;line-height:1.35;white-space:normal}.address-option em{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;border-radius:6px;background:#eee9df;color:#726c61;font-size:8px;font-style:normal;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}.address-option.selected:after{content:'✓';grid-column:2;grid-row:1/3;color:#ff6038;font-weight:900}.address-list::-webkit-scrollbar{width:7px}.address-list::-webkit-scrollbar-thumb{background:#d5cfc3;border-radius:10px}
    </style>
    <title>CraveLens</title>
</head>

<body>
    <main>
        <header>
            <div class="logo">◉</div>
            <div>
                <h1>CraveLens</h1>
                <p>See it. Crave it. Get it.</p>
            </div><label class="switch"><input id="enabled" type="checkbox"><span></span></label>
        </header>
        <section class="status"><i id="connectionDot"></i>
            <div><strong id="connectionTitle">Connecting to Swiggy…</strong><small id="connectionDetail">Secure sign-in
                    opens automatically</small></div>
        </section><button id="connect" class="secondary" hidden>Connect Swiggy</button>
        <section>
            <h2>Personal context</h2><label>Delivery address</label>
            <div id="addressPicker" class="address-picker">
                <button id="addressTrigger" class="address-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span><b id="addressPrimary">Connect Swiggy</b><small id="addressSecondary">Sign in to load delivery addresses</small></span><i>⌄</i>
                </button>
                <div id="addressList" class="address-list" role="listbox" hidden></div>
            </div>
            <small id="addressHint" class="hint"></small>
        </section>
        <section>
            <h2>Detection</h2><label>Food sensitivity <output id="sensitivityValue"></output><input id="sensitivity"
                    type="range" min="0.35" max="0.8" step="0.01"></label>
            <label class="debug-row">Debug overlay <input id="debug" type="checkbox"></label>
            <button id="scan" class="secondary">Scan current frame</button>
        </section>
        <footer><button id="save">Save settings</button>
            <p id="message"></p>
        </footer>
    </main>
    <script type="module" src="./popup.js"></script>
</body>

</html>
