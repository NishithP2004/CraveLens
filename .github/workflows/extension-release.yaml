name: Package extension release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, zip, and release extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/extension/public/manifest.json').version")"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            if [[ "${release_tag}" != "${expected_tag}" ]]; then
              echo "Tag ${release_tag} does not match extension manifest version ${expected_tag}." >&2
              exit 1
            fi
          else
            release_tag="${expected_tag}"
            git fetch --tags --force
            if ! git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
              git tag "${release_tag}"
              git push origin "refs/tags/${release_tag}"
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "asset=cravelens-extension-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Build extension
        run: npm run build -w @cravelens/extension

      - name: Zip extension bundle
        shell: bash
        run: |
          set -euo pipefail
          cd apps/extension/dist
          zip -r "../../../${{ steps.release.outputs.asset }}" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cravelens-extension-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.asset }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_ASSET}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${RELEASE_ASSET}" \
              --title "CraveLens Extension ${RELEASE_VERSION}" \
              --notes "Chrome extension package built from manifest version ${RELEASE_VERSION}."
          fi
